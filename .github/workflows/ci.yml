name: CI/CD Pipeline - SalesHub

on:
  # Desarrollo local sin despliegue (FIX-CI-001): el workflow NO se dispara en
  # cada push, para no generar un run ni una notificación por commit. El badge
  # conserva el último resultado verde. Se ejecuta a mano o al abrir un PR.
  # Si el proyecto se publica, volver a agregar `push: branches: [master, main]`.
  workflow_dispatch:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint (tsc + ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Mapa del código actualizado (sin costo de tokens)
        run: npm run map:check

      - name: Dependencias circulares (madge)
        run: npm run deps:circular

      - name: Run Automated Tests (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
